# Render.com deployment config
# Deploy at: https://render.com → New → Web Service → connect your repo

services:
  - type: web
    name: casting-finder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DB_PATH
        value: /data/castings.db
    disk:
      name: casting-data
      mountPath: /data
      sizeGB: 1
